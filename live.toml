# Trading. The filters, the exit, and the parts that spend money.
#
# The filters below gate the BUY, not the watching. Every launch the launchpad
# emits is still followed and journalled, because the only way to know when the
# flow these filters look for comes back is to have kept the flow that is not
# it - and right now most of it is not: on one afternoon 62% of launches
# carried a creator fee above 300 bps and 88% had no dev buy worth the name,
# against 8% and 19% the night before. So this run collects everything and buys
# almost nothing, which is the correct behaviour and is also why it may sit
# idle for an hour at a time.
#
#   WS_URL=... HTTP_URL=... PRIVATE_KEY=... SUBMIT_URLS=... \
#     ./target/release/trading-sniper --watch-launches --config live.toml --execute
#
# SUBMIT_URLS is optional and comma-separated: every endpoint on it gets the
# identical signed transaction at once, and the first to take it wins. Unset,
# a buy waits on one node's queue - and that node has been answering reads with
# "fullnode unavailable" several times an hour.
#
# Without --execute nothing is sent: the same watching, the same journals, the
# same shadow, and no wallet is even loaded. That is the dry run - there is no
# separate config for one.
# With it, three things must all be true or the run refuses to start: the flag,
# a contract below, and that contract answering that this wallet owns it.

[snipe]
# The wrapper. A buy goes to it and the position is bought TO it, because the
# curve pulls the launched token with transferFrom and that token does not
# exist until the launch - so a position held anywhere else takes two
# transactions to leave, and the exit is worth what it is because it lands
# within a block.
contract = "0x75C1243Da9AF8Bd6b01193de40A8dc4Af75C6cb2"

# The size everything below was measured at. On ETH pairs, 16.8 mETH a launch.
#
# It ran at a tenth of this first, deliberately, because a simulation knows
# nothing about gas or reverts. That tenth answered its question. Gas is a
# fixed cost a round trip and the edge is a fraction of the stake, so the ratio
# between them is set by the size alone - and both halves are now measured on
# chain rather than guessed at: 125,508 gas in and 102,756 out at 0.232 gwei,
# which is 53 microETH a round trip.
#
# At a tenth of this the stake is 1680 microETH and the edge about 207, so gas
# takes 26% of it. Here the edge is about 2066 and gas takes 3%.
#
# A hundred rather than more because a hundred is what was measured, impact
# included: the replay priced our own buy into the curve at exactly this share.
# Above it nothing has been measured and the returns would be an extrapolation
# through our own market impact.
size_x100 = 100

# The filters. Each was measured on the journals; the reasoning for each is in
# the commit that added it and in src/snipe.rs beside the field it sets.
pairs               = ["ETH"]
min_exempt          = 6
max_creator_tax_bps = 0
max_dev_buy_x100    = 1500
min_dev_buy_x100    = 200
operator_needs      = 5
max_run_x100        = 1000000
max_exempt          = 100000
require_dev_buy     = false

# The exit, measured with one block between seeing a price and selling into it.
#
# Two allowances, not one. On the way in, 1%: the price barely moves inside the
# block being aimed at, and what guards the tax is the wrapper, exactly, not
# this. On the way out, 3%: the stop fires BECAUSE the price gave back 5% of
# its high, so the floor is set at the moment the price is moving fastest and
# the sale lands a block later. The measurement behind every number in this
# file priced the exit one block later and filled it with no floor at all - 3%
# is the closest a real floor gets to that, and it stays under the 5% trail so
# a fill never gives back more than the stop itself tolerates.
slippage_bps      = 100
exit_slippage_bps = 300
max_tax_bps  = 19
lead_ms      = 100
trail_bps    = 500
take_x100    = 200
hold_blocks  = 588
operators    = "operators.json"

# The rails. None of these is a strategy: they are what keeps a bad hour from
# becoming a bad day.
#
# max_open   positions at once. Every one is money sitting in the contract, and
#            the exit rules were measured one position at a time.
# max_spend  the most this RUN may LOSE, in the pair token: everything sent,
#            plus gas, less everything that came back. Reached, it stops buying
#            and says so - it does not stop selling.
#
#            It used to cap gross sends, which measured the wrong thing twice:
#            the same stake going out and back thirty times an hour is not
#            thirty times the risk, and the case the cap exists for - every buy
#            reverting - spends gas and returns nothing, which a gross counter
#            never sees. At 16.8 mETH a stake the old reading would also have
#            stopped this run after three buys.
#
#            Sixty is a little over the worst drawdown the journals show, 3.1
#            stakes: a bad patch does not halt the run, and something actually
#            broken does. It is also about half the wallet, which leaves the
#            other half for gas and the open position.
# gas_limit  not estimated per trade: an estimate is a round trip inside the
#            window the whole thing is aimed at. Unused gas comes back; a limit
#            reached is a trade lost.
max_open  = 1
max_spend = "0.06"
gas_limit = 2000000
