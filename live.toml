# Trading. Everything here is filtered.toml plus the parts that spend money.
#
#   WS_URL=... HTTP_URL=... PRIVATE_KEY=... \
#     ./target/release/trading-mm-fall --watch-launches --config live.toml --execute
#
# Without --execute nothing is sent and this behaves exactly like filtered.toml.
# With it, three things must all be true or the run refuses to start: the flag,
# a contract below, and that contract answering that this wallet owns it.
threshold_pct = 3

[[pools]]
name = "placeholder"
version = "v3"
address = "0x0000000000000000000000000000000000000001"

[snipe]
# The wrapper. A buy goes to it and the position is bought TO it, because the
# curve pulls the launched token with transferFrom and that token does not
# exist until the launch - so a position held anywhere else takes two
# transactions to leave, and the exit is worth what it is because it lands
# within a block.
contract = "0x75C1243Da9AF8Bd6b01193de40A8dc4Af75C6cb2"

# A tenth of what the journals were measured at, on purpose. On ETH pairs this
# is 1.68 mETH a launch. Everything below it was measured in simulation, and a
# simulation does not know about gas, reverts, or being ordered behind somebody
# aiming at the same block. Raise it to 100 - the measured size - once real
# fills have said the same thing the journals do.
size_x100 = 10

# Every filter, and why, is in filtered.toml - these are the same values.
pairs               = ["ETH"]
min_exempt          = 6
max_creator_tax_bps = 0
max_dev_buy_x100    = 1500
min_dev_buy_x100    = 200
operator_needs      = 5
max_run_x100        = 1000000
max_exempt          = 100000
require_dev_buy     = false

# The exit, measured with one block between seeing a price and selling into it.
slippage_bps = 100
max_tax_bps  = 19
lead_ms      = 100
trail_bps    = 500
take_x100    = 200
hold_blocks  = 588
operators    = "operators.json"

# The rails. None of these is a strategy: they are what keeps a bad hour from
# becoming a bad day.
#
# max_open   positions at once. Every one is money sitting in the contract, and
#            the exit rules were measured one position at a time.
# max_spend  the most this RUN may spend in total, in the pair token. Reached,
#            it stops buying and says so - it does not stop selling.
# gas_limit  not estimated per trade: an estimate is a round trip inside the
#            window the whole thing is aimed at. Unused gas comes back; a limit
#            reached is a trade lost.
max_open  = 1
max_spend = "0.05"
gas_limit = 2000000
