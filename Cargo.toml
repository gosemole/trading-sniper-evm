[package]
name = "trading-mm-fall"
version = "0.1.0"
edition = "2021"

[dependencies]
ethers = { version = "2", features = ["ws", "rustls", "abigen"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
