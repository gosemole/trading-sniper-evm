[package]
name = "trading-mm-fall"
version = "0.1.0"
edition = "2021"
# Two binaries in the tree, and every command in the README is the bot. Without
# this `cargo run` refuses to pick one, which is a stop for a person following
# the README and no help at all to the person who wanted `probe`.
default-run = "trading-mm-fall"

[dependencies]
ethers = { version = "2", features = ["ws", "rustls", "abigen"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
futures-util = "0.3"
# The Nitro sequencer feed is a plain WebSocket carrying its own JSON, not
# JSON-RPC, so it cannot be read through a provider. Both versions are the ones
# ethers already resolves, so naming them here adds no new code to the tree -
# only access to it, and only for the `probe` binary.
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
base64 = "0.21"

[profile.release]
lto = true
codegen-units = 1
