# Copy to config.toml, uncomment the blocks you want, run.
# At least one pool block is required.
#
# Secrets come from the environment, not from here:
#   WS_URL       wss:// endpoint (live swap logs)
#   HTTP_URL     https:// endpoint (calls)
#   PRIVATE_KEY  32-byte hex signing key, needed only to buy
#
#   chmod 600 ~/.config/mm-fall.env
#   set -a; source ~/.config/mm-fall.env; set +a

threshold_pct = 3     # signal on a drop this big (%) inside one block
max_move_pct = 1.0    # depth line: what it costs to move the price this much (%)

# universal_router is needed for --approve, --swap and auto_buy; not for the
# monitor. pool_manager is shared by every v4 pool and every v4 route, so it is
# written once here and left out of the pools themselves.
# universal_router = "0x06AfBA43Fd06227fA663b0DAecF536f6EaA6bf99"
# pool_manager     = "0x8366a39CC670B4001A1121B8F6A443A643e40951"

[tokens]
ETH      = "0x0000000000000000000000000000000000000000"
WETH     = "0x0bd7d308f8e1639fab988df18a8011f41eacad73"
USDG     = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
PONS     = "0x39dbed3a2bd333467115de45665cc57f813c4571"
POOLS    = "0x385b36ff682ab4c76e7c37a66b96aabc466471d5"

# v4 pool: the pool_id is all it takes - the manager comes from pool_manager
# above. An `address` here still works and overrides it, for a pool held by a
# different manager.
# [[pools]]
# name = "CAMELTOE/LULU (v4)"
# version = "v4"
# pool_id = "0x1e75aa57c6f96fd805296b4fa4969741060407f62c94a7f88c3fdfccc6cc2d35"
# base_token = 1        # the side that "fell"; indexes the SORTED PoolKey
# threshold_pct = 5     # optional, overrides the global

# v3 pool: the pair address is all it takes.
# [[pools]]
# name = "PONS/WETH (v3)"
# version = "v3"
# address = "0x10CC6BD38112cAc182db90B6a71d8Bb5939526bA"
# base_token = 1

# Route: input token + pools in swap order. USDG -> LULU -> CAMELTOE.
# A pool is written as a 32-byte v4 pool id or a 20-byte v3 pool address, and
# the two may be mixed in one route - consecutive pools on the same protocol
# become a single router command, and only a v3/v4 boundary costs a hand-off.
# A route ending on v3 is quoted by bisection (~25 calls) instead of one, so
# prefer ending on v4 for an auto_buy route.
# Check it with:  cargo run -- --check-routes
#                 cargo run -- --quote "buy CAMELTOE"
# auto_buy fires on the LAST pool listed, so the buy goes through the pool the
# drop was seen in. That pool must also be in [[pools]]. Override with
# trigger_pool = "0x...".
# [[routes]]
# name = "buy CAMELTOE"
# input = "USDG"
# amount_in = "0.1"          # in USDG, which has 6 decimals: ten cents.
#                            # With impact_pct below it is a CEILING, not the
#                            # size: the most one buy will ever spend.
# impact_pct = 0.5           # optional. Size each buy to move the trigger
#                            # pool's price by this much, rather than always
#                            # spending amount_in. Must be below
#                            # max_slippage_pct. Worked out from the signal's
#                            # own log and the tick ladder already in memory,
#                            # so it costs no requests. Omit for a fixed size.
# max_slippage_pct = 1.0     # percent, not basis points
# auto_buy = true            # buy when the trigger pool signals a drop
# cooldown_secs = 60
# pools = [
#   "0xd4fa4c9859b69466b3e35d7907789e6d22d5200f3d7634532d825a4469cec863",  # v4 USDG/LULU
#   "0x1e75aa57c6f96fd805296b4fa4969741060407f62c94a7f88c3fdfccc6cc2d35",  # v4 LULU/CAMELTOE
# ]

# Mixing protocols: a v3 pool is named by address, and needs nothing else -
# token0/token1/fee/tickSpacing are read off the pool contract.
# [[routes]]
# name = "buy PONS"
# input = "USDG"
# amount_in = "0.1"
# max_slippage_pct = 1.0
# pools = [
#   "0xd4fa4c9859b69466b3e35d7907789e6d22d5200f3d7634532d825a4469cec863",  # v4 USDG/LULU
#   "0x10CC6BD38112cAc182db90B6a71d8Bb5939526bA",                          # v3 WETH/PONS
# ]

# Sell the whole position back down the route once the pool price is this far
# above what it was bought at, averaged over every buy. Unset means buy and
# hold. NOTE: this is a gain against the pool's quote token, not against the
# dollar - on a pair whose quote side is itself volatile the two can disagree.
#   take_profit_pct = 5.0
#
# What is held and what it cost, kept across restarts. Written after every fill.
# inventory_path = "inventory.json"
#
# Give up on a position that has been held this long since the LAST buy,
# whatever the price is doing. Checked on a timer, not on price updates: a
# position worth abandoning is usually in a pool that has gone quiet.
#   exit_after_secs = 3600
