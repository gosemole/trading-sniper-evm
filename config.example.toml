# Copy to config.toml, uncomment the blocks you want, run.
# At least one pool block is required.
#
# Secrets come from the environment, not from here:
#   WS_URL       wss:// endpoint (live swap logs)
#   HTTP_URL     https:// endpoint (calls)
#   PRIVATE_KEY  32-byte hex signing key, needed only to buy
#
#   chmod 600 ~/.config/mm-fall.env
#   set -a; source ~/.config/mm-fall.env; set +a

threshold_pct = 3     # signal on a drop this big (%) inside one block
gas_reserve = "0.05"  # native currency that must be on hand for gas. Below it
                      # nothing is bought at all - a position bought with the
                      # last of the gas cannot be sold. A route may not spend
                      # the native currency itself; use weth below
max_move_pct = 1.0    # depth line: what it costs to move the price this much (%)

# universal_router is needed for --approve, --swap and auto_buy; not for the
# monitor. pool_manager is shared by every v4 pool and every v4 route, so it is
# written once here and left out of the pools themselves.
# universal_router = "0x06AfBA43Fd06227fA663b0DAecF536f6EaA6bf99"
# multicall        = "0xcA11bde05977b3631167028862bE2a173976CA11"
#   Multicall3, used to read a v3 pool in one request instead of two dozen -
#   v4 has extsload for this, v3 has only its own view functions. The default
#   above is the canonical deterministic deployment; never required, and a
#   chain without it just costs more requests.
# pool_manager     = "0x8366a39CC670B4001A1121B8F6A443A643e40951"
# weth             = "0x0bd7d308f8e1639fab988df18a8011f41eacad73"
#   Set this to trade a NATIVE pool while holding the wrapped token instead. A
#   v4 pool names its currencies, so one holding ETH is a different pool from
#   one holding WETH and there is no choice about which to use - but with this
#   set, a route can write `input = "WETH"` for a native pool and the router
#   unwraps on the way in and wraps on the way out, inside the same
#   transaction. This is the ONLY way to trade a native pool: a route that
#   spends the native currency directly is refused, because that balance is
#   what gas is paid from.

# The launch sniper. Everything here is a judgement about the launchpad rather
# than a rule, which is why it lives in the config: the rules are in the code.
# Without `size` nothing is followed and nothing is decided.
# [snipe]
# contract            = "0x..."
#   The deployed PonsSniper, which a launch is bought THROUGH rather than from.
#   It holds the standing approval for each quote token, so a curve that did
#   not exist a second ago is approved and bought from in one transaction.
#   Approve it once per quote token, from the wallet this bot signs with, for
#   an amount you are willing to lose - the approval outlives every trade.
#   Omitted, a native launch is still bought straight from the curve and an
#   ERC-20 launch is not bought at all: its approval would not fit the window.
# size_x100           = 100
#   What to spend on one launch, as hundredths of a percent of the curve's
#   phantom reserve. 100 is one percent. A fraction rather than an amount:
#   0.05 is three percent of a native curve, whose reserve is 1.68 ETH, and
#   nothing at all of a USDG one, whose reserve is 3236. What decides the
#   result is the share of the curve taken, because that is what our own
#   buying and selling moves against us. Zero follows nothing.
# size                = "0.1"
#   A ceiling on that, in the PAIR TOKEN's own units. Empty means none.
# slippage_bps        = 100
#   Must stay BELOW the gap between two tax steps. The steps are 618 bps and
#   then 19, about six percent apart in price; an allowance wider than that
#   would be satisfied by a fill one second early, and the whole point of the
#   minimum is that it is not.
# max_tax_bps         = 19
#   The dearest snipe tax worth paying. The launch second charges 99% and is
#   refused by the wrapper outright, whatever is set here.
# max_creator_tax_bps = 0
#   A creator tax is charged on the way in AND on the way out. Zero by default:
#   a launch that wants a cut of both legs is one there is no need to be in.
#   Above this the launch is not even followed.
# max_run_x100        = 200
#   How far above the opening price this will still buy, in hundredths. A
#   launch whose exempt wallets bundled into its own block opens the free
#   window at four or five times what the curve started at.
# max_exempt          = 4
#   More declared exemptions than this and the launch is an arrangement rather
#   than a market. Above it the launch is not followed at all.
# require_dev_buy     = true
#   Refuse a launch whose maker bought none of it - `launchToken` rather than
#   `launchAndBuy`. The sharpest thing in the journals so far, and known from
#   the feed before the block exists: of the launches made without a dev buy,
#   four in five saw no trade at all in their first minute; of those made with
#   one, none were dead.
# min_dev_buy_x100    = 500
#   The smallest dev buy worth following, against the curve's phantom reserve,
#   in hundredths of a percent. 500 is five percent - the same statement on
#   every pair, since it is measured against the curve rather than in absolute
#   terms.
# lead_ms             = 100
#   How long before a step opens the decision is made. The transaction still
#   has to be signed and sent after it.

[tokens]
ETH      = "0x0000000000000000000000000000000000000000"
WETH     = "0x0bd7d308f8e1639fab988df18a8011f41eacad73"
USDG     = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
PONS     = "0x39dbed3a2bd333467115de45665cc57f813c4571"
POOLS    = "0x385b36ff682ab4c76e7c37a66b96aabc466471d5"

# v4 pool: the pool_id is all it takes - the manager comes from pool_manager
# above. An `address` here still works and overrides it, for a pool held by a
# different manager.
# [[pools]]
# name = "CAMELTOE/LULU (v4)"
# version = "v4"
# pool_id = "0x1e75aa57c6f96fd805296b4fa4969741060407f62c94a7f88c3fdfccc6cc2d35"
# base_token = 1        # the side that "fell"; indexes the SORTED PoolKey
# threshold_pct = 5     # optional, overrides the global

# v3 pool: the pair address is all it takes.
# [[pools]]
# name = "PONS/WETH (v3)"
# version = "v3"
# address = "0x10CC6BD38112cAc182db90B6a71d8Bb5939526bA"
# base_token = 1

# Route: input token + pools in swap order. USDG -> LULU -> CAMELTOE.
# A pool is written as a 32-byte v4 pool id or a 20-byte v3 pool address, and
# the two may be mixed in one route - consecutive pools on the same protocol
# become a single router command, and only a v3/v4 boundary costs a hand-off.
# A route ending on v3 is quoted by bisection (~25 calls) instead of one, so
# prefer ending on v4 for an auto_buy route.
# Check it with:  cargo run -- --check-routes
#                 cargo run -- --quote "buy CAMELTOE"
# auto_buy fires on the LAST pool listed, so the buy goes through the pool the
# drop was seen in. That pool must also be in [[pools]]. Override with
# trigger_pool = "0x...".
# [[routes]]
# name = "buy CAMELTOE"
# input = "USDG"
# impact_pct = 0.5           # size each buy to move the trigger pool's price
#                            # by this much. There is no fixed amount and no
#                            # ceiling here: the ceiling is the tracked
#                            # balance, and if the whole of it still cannot
#                            # move the pool this far the buy is skipped rather
#                            # than shrunk. Must be below max_slippage_pct.
# max_slippage_pct = 1.0     # percent, not basis points
# auto_buy = true            # buy when the trigger pool signals a drop
# cooldown_secs = 60
# pools = [
#   "0xd4fa4c9859b69466b3e35d7907789e6d22d5200f3d7634532d825a4469cec863",  # v4 USDG/LULU
#   "0x1e75aa57c6f96fd805296b4fa4969741060407f62c94a7f88c3fdfccc6cc2d35",  # v4 LULU/CAMELTOE
# ]

# Mixing protocols: a v3 pool is named by address, and needs nothing else -
# token0/token1/fee/tickSpacing are read off the pool contract.
# [[routes]]
# name = "buy PONS"
# input = "USDG"
# amount_in = "0.1"
# max_slippage_pct = 1.0
# pools = [
#   "0xd4fa4c9859b69466b3e35d7907789e6d22d5200f3d7634532d825a4469cec863",  # v4 USDG/LULU
#   "0x10CC6BD38112cAc182db90B6a71d8Bb5939526bA",                          # v3 WETH/PONS
# ]

# Sell the whole position back down the route once the pool price is this far
# above what it was bought at, averaged over every buy. Unset means buy and
# hold. NOTE: this is a gain against the pool's quote token, not against the
# dollar - on a pair whose quote side is itself volatile the two can disagree.
#   take_profit_pct = 5.0
#
# What is held and what it cost, kept across restarts. Written after every fill.
# inventory_path = "inventory.json"
#
# Give up on a position that has been held this long since the LAST buy,
# whatever the price is doing. Checked on a timer, not on price updates: a
# position worth abandoning is usually in a pool that has gone quiet.
#   exit_after_secs = 3600
